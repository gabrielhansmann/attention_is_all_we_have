[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-requirement-evidence-engine"
version = "0.1.0"
description = "Backend for the requirement evidence engine: API, agents, knowledge layer, ingestion."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_auth: exercises the real authentication dependency instead of the signed-in test user"]
